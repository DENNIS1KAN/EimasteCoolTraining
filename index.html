<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eimaste Cool" />
    <meta name="description" content="Train together: workouts, weight, meal plans and friendly competition." />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Eimaste Cool Training</title>
    <script>
      // Apply the saved theme and language before first paint (no flash).
      try {
        var t = localStorage.getItem('ect-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        var l = localStorage.getItem('ect-lang') || ((navigator.language || '').toLowerCase().indexOf('el') === 0 ? 'el' : 'en')
        document.documentElement.lang = l
      } catch (e) {}
    </script>
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
